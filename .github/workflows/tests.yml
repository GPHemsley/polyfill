name: Tests

on:
    push:
    pull_request:

jobs:

    test:
        name: PHPUnit Tests
        runs-on: ubuntu-latest

        env:
            COMPOSER_ROOT_VERSION: 1.x-dev

        strategy:
            matrix:
                php: [
                    '7.2',
                    '7.3',
                    '7.4',
                    '8.0',
                    '8.1',
                    '8.2',
                    '8.3',
                    '8.4',
                    '8.5',
                    '8.6',
                ]
                icu: [
                    # '50.2',  # Unicode 6.2
                    # '52.2',  # Unicode 6.3
                    # '54.2',  # Unicode 7.0
                    # '56.2',  # Unicode 8.0
                    # '58.3',  # Unicode 9.0
                    # '60.3',  # Unicode 10.0
                    # '62.2',  # Unicode 11.0
                    # '64.2',  # Unicode 12.0
                    # '66.1',  # Unicode 13
                    # '70.1',  # Unicode 14
                    '72.1',  # Unicode 15
                    '73.2',  # current pin
                    '74.2',  # Unicode 15.1
                    '76.1',  # Unicode 16, Symfony 5.4
                    '78.3',  # Unicode 17, Symfony 6.4
                ]
            fail-fast: false

        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    extensions: "apcu, intl-${{ matrix.icu }}, mbstring, odbc, uuid, mongodb"
                    ini-values: "memory_limit=-1, session.gc_probability=0, apc.enable_cli=1"
                    php-version: "${{ matrix.php }}"
                    tools: "composer:v2"

            -   name: Install ext-deepclone via PIE
                if: ${{ matrix.php >= '8.2' }}
                run: |
                    curl -sLO https://github.com/php/pie/releases/latest/download/pie.phar
                    sudo BOX_REQUIREMENT_CHECKER=0 php pie.phar install symfony/deepclone
                    php --ri deepclone || echo "extension=deepclone" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-deepclone.ini"
                    php -m | grep -q deepclone && echo "deepclone loaded" || echo "deepclone NOT loaded"

            -   name: Install dependencies
                run: |
                    composer --prefer-source --no-progress --ansi install
                    ./phpunit install

            -   name: Run tests
                run: |
                    ok=0
                    ./phpunit || ok=1
                    [[ "${{ matrix.mode }}" = experimental ]] || (exit $ok)
